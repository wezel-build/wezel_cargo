[package]
name = "wezel_cargo"
version = "0.1.0"
repository = "https://github.com/wezel-build/wezel_cargo"
publish = false
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "wezel_cargo"
path = "src/main.rs"

[package.metadata.dist]
dist = true

[dependencies]
anyhow = "1"
forager_sdk = { git = "https://github.com/wezel-build/wezel", rev = "a5859f2458dc72baf5f17622678b69432decba1f" }
schemars = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.dist]
inherits = "release"
lto = "thin"
